
name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:


permissions:
  id-token: write   # Required for requesting the JWT OIDC token
  contents: read 

jobs:
  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./day6-capstone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"

      - name: Configure AWS credentials 
  
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::563691829137:role/github-actions-deploy-role
          role-session-name: github-actions-deploy-role
          aws-region: ap-south-1
     
      - name: Verify AWS identity
      
        run: aws sts get-caller-identity

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Run Terraform tests
        run: terraform test -no-color

      - name: Generate plan
        run: terraform plan -input=false -no-color

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
